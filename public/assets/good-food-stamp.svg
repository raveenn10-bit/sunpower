<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <path id="topTextArc" d="M 50 150 A 100 100 0 0 1 250 150" fill="none" />
    <path id="bottomTextArc" d="M 250 150 A 100 100 0 0 1 50 150" fill="none" />
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Disc -->
  <circle cx="150" cy="150" r="140" fill="#d9e1d5" filter="url(#shadow)" />
  <circle cx="150" cy="150" r="134" fill="none" stroke="#233e2f" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4" />

  <!-- Arched Typography -->
  <text font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#233e2f" letter-spacing="5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">GOOD FOOD</textPath>
  </text>
  
  <text font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#233e2f" letter-spacing="5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">GOOD MOOD</textPath>
  </text>

  <!-- Center Asterisk Emblem -->
  <g transform="translate(150, 150)" stroke="#233e2f" stroke-width="4.5" stroke-linecap="round">
    <line x1="0" y1="-24" x2="0" y2="24" />
    <line x1="-24" y1="0" x2="24" y2="0" />
    <line x1="-17" y1="-17" x2="17" y2="17" />
    <line x1="-17" y1="17" x2="17" y2="-17" />
  </g>
</svg>
